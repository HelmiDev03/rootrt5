# Tier "backend" : API Node.js (image construite localement puis chargee dans kind)
# Pod a 2 conteneurs : un init container attend que Redis soit joignable avant de demarrer l'API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devops-app
  labels:
    app: api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: backend
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z -w 2 redis 6379; do echo 'attente de redis...'; sleep 2; done; echo 'redis est joignable'"]
      containers:
      - name: api
        image: tp-api:1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_URL
          value: redis://redis:6379      # nom DNS du Service ClusterIP redis
        - name: APP_VERSION
          value: "1.0.0"
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devops-app
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
