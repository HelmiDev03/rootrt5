apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - servicemonitors-argocd.yaml
  - prometheusrule-gitops.yaml

# The dashboard is versioned as plain JSON (the export from Grafana) and turned into a
# ConfigMap that the Grafana sidecar loads automatically (label grafana_dashboard=1).
configMapGenerator:
  - name: grafana-dashboard-gitops
    files:
      - dashboards/tp4-gitops-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: TP4
