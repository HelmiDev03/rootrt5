apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: tp4
  source:
    repoURL: https://github.com/HelmiDev03/rootrt5.git
    targetRevision: tp4-gitops
    path: devOps/TP4/gitops/workloads/podinfo/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo-prod
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true      # objects removed from Git are removed from the cluster
      selfHeal: true   # manual changes on the cluster are reverted to the Git state
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
