# Least privilege: the TP4 applications may only come from this repository (and the
# Prometheus chart repository) and may only deploy into their own namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tp4
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: TP4 GitOps - podinfo workloads and observability stack
  sourceRepos:
    - https://github.com/HelmiDev03/rootrt5.git
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: podinfo-dev
    - server: https://kubernetes.default.svc
      namespace: podinfo-prod
    - server: https://kubernetes.default.svc
      namespace: monitoring
    # kube-prometheus-stack also installs the kubelet/coredns Services in kube-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
  # Cluster-scoped objects the projects really need (CRDs, RBAC and webhooks of the stack).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
  orphanedResources:
    warn: true
