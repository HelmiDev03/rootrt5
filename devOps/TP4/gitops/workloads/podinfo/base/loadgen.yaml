# Small traffic generator so the application metrics (requests, latency, errors) move.
# About 1 request in 20 hits /status/500 to produce a visible error rate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: curlimages/curl:8.17.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                if [ $((i % 20)) -eq 0 ]; then p=/status/500; else p=/; fi
                curl -s -o /dev/null --max-time 2 http://podinfo:9898$p || true
                sleep 0.5
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
